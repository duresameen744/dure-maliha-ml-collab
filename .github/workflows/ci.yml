name: CI

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Lint (ruff format check)
        run: uv run ruff format --check .

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v || [ $? -eq 5 ]

      - name: Smoke train (small sample)
        run: |
          uv run python -c "
          import pandas as pd
          df = pd.read_csv('data/raw/adult.csv').sample(300, random_state=42)
          df.to_csv('data/raw/adult_sample.csv', index=False)
          "
